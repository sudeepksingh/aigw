name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  linux:
    name: Linux build, tests, smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential cmake pkg-config git libjson-c-dev libnetfilter-conntrack-dev \
            dnsutils nftables dnsmasq-base curl python3 mosquitto mosquitto-clients zbar-tools \
            python3-numpy python3-sklearn python3-cryptography wireguard-tools
      - name: OpenWRT libraries
        run: sudo ./scripts/build-deps.sh
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Smoke test
        run: sudo UPSTREAM=1.1.1.1 tests/smoke.sh build
      - name: Flow sensor test (network namespaces)
        run: sudo tests/flow-test.sh build
      - name: Behaviour baseline test (network namespaces, fast clock)
        run: sudo tests/baseline-test.sh build
      - name: Act test (decisions, guardrails, nft and DNS actuators)
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/act-test.sh build
      - name: Plug-in test (plug-ins, skills, Wi-Fi keys, MQTT and Home Assistant)
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/plug-test.sh build
      - name: Outside test (bridge, cortex, retrain, signed hot-loaded model, MCP)
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/outside-test.sh build
      - name: Remote access test (WireGuard between network namespaces)
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/remote-test.sh build
      - name: Shell syntax
        run: for f in scripts/aigw-nft scripts/aigw-dhcp-event scripts/aigw-remote platform/pc-ap/aigw-ap platform/pc-ap/install.sh tests/*.sh plugins/examples/*/run.sh; do sh -n "$f"; done

  openwrt:
    name: OpenWRT ${{ matrix.version }} ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: "24.10", target: x86/64 }
          - { version: "24.10", target: mediatek/filogic }
          - { version: "24.10", target: ramips/mt7621 }
          - { version: "25.12", target: x86/64 }
    steps:
      - uses: actions/checkout@v5
      - name: Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential curl rsync unzip file gawk \
            python3 python3-setuptools zstd libncurses-dev
      - name: Build package
        env:
          VERSION: ${{ matrix.version }}
          TARGET: ${{ matrix.target }}
        run: platform/openwrt/build-sdk.sh
      - name: Name artifact
        id: name
        run: echo "name=aigw-openwrt-${{ matrix.version }}-$(echo '${{ matrix.target }}' | tr / -)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: dist/openwrt/

  release:
    name: Release packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, openwrt]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # architecture-independent packages (e.g. aigw-remote_*_all.ipk) come from
        # every target with the same name: upload one of each
        run: |
          mkdir -p up
          find dist -type f \( -name '*.ipk' -o -name '*.apk' \) | sort | while read -r f; do
            [ -e "up/$(basename "$f")" ] || cp "$f" up/
          done
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --generate-notes up/*
