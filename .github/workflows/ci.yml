name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  linux:
    name: Linux build, tests, smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential cmake pkg-config git libjson-c-dev dnsutils nftables
      - name: OpenWRT libraries
        run: sudo ./scripts/build-deps.sh
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Smoke test
        run: sudo UPSTREAM=1.1.1.1 tests/smoke.sh build
      - name: nft rules render
        run: sh -n scripts/aigw-nft && sh -n platform/pc-ap/aigw-ap && sh -n platform/pc-ap/install.sh

  openwrt:
    name: OpenWRT ${{ matrix.version }} ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: "24.10", target: x86/64 }
          - { version: "24.10", target: mediatek/filogic }
          - { version: "24.10", target: ramips/mt7621 }
          - { version: "25.12", target: x86/64 }
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential curl rsync unzip file gawk \
            python3 python3-setuptools zstd libncurses-dev
      - name: Build package
        env:
          VERSION: ${{ matrix.version }}
          TARGET: ${{ matrix.target }}
        run: platform/openwrt/build-sdk.sh
      - name: Name artifact
        id: name
        run: echo "name=aigw-openwrt-${{ matrix.version }}-$(echo '${{ matrix.target }}' | tr / -)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: dist/openwrt/

  release:
    name: Release packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, openwrt]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f \( -name '*.ipk' -o -name '*.apk' \) -print0 |
            xargs -0 gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --generate-notes
