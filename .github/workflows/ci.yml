name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  linux:
    # the full profile keeps the bare name: branch protection requires that check
    name: Linux build, tests, smoke test${{ matrix.profile != 'full' && format(' ({0} profile)', matrix.profile) || '' }}
    runs-on: ubuntu-24.04
    # a stalled runner (it happened in the package download) fails in time
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # the features built (docs/features.md): every test runs; one for a feature not built says SKIP
        profile: [full, small, minimal]
    steps:
      - uses: actions/checkout@v5
      - name: Packages
        timeout-minutes: 20
        run: |
          # GitHub's runners use Azure's Ubuntu mirror; when it can't be resolved, Ubuntu's own
          getent hosts azure.archive.ubuntu.com >/dev/null || sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential cmake pkg-config git libjson-c-dev libnetfilter-conntrack-dev \
            dnsutils nftables dnsmasq-base curl python3 mosquitto mosquitto-clients zbar-tools \
            python3-numpy python3-sklearn python3-cryptography wireguard-tools \
            autoconf automake libtool libssl-dev libsqlite3-dev zlib1g-dev libmosquitto-dev \
            protobuf-compiler python3-protobuf python3-paho-mqtt \
            libcurl4-openssl-dev libmxml-dev uuid-dev \
            libyajl-dev liburiparser-dev libcap-ng-dev libevent-dev flex bison
      - name: OpenWRT libraries
        run: sudo ./scripts/build-deps.sh
      - name: OB-USP-Agent (USP / TR-369 agent, pinned)
        run: echo "OBUSPA_SRC=$(scripts/build-obuspa.sh | tail -1)" >> "$GITHUB_ENV"
      - name: icwmp (TR-069 client, pinned)
        run: echo "ICWMPD=$(scripts/build-icwmp.sh | tail -1)" >> "$GITHUB_ENV"
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DAIGW_OBUSPA_SRC="$OBUSPA_SRC" -DAIGW_PROFILE=${{ matrix.profile }}
          cmake --build build -j
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Smoke test
        run: sudo UPSTREAM=1.1.1.1 tests/smoke.sh build
      - name: Flow sensor test (network namespaces)
        run: sudo tests/flow-test.sh build
      - name: Behaviour baseline test (network namespaces, fast clock)
        run: sudo tests/baseline-test.sh build
      - name: Lookup burst test (generated names that look like words, caught by behaviour)
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/burst-test.sh build
      - name: Data model test (ag.dm, the layer USP and TR-069 share)
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/dm-test.sh build
      - name: Proactive care test (problems found by the gateway itself, told to the ISP, the score)
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/care-test.sh build
      - name: TR-143 diagnostics test (IPPing, TraceRoute, Download, Upload, NSLookup against local servers)
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/tr143-test.sh build
      - name: Early warning test (the home's normal speed learned, a drop warned of, LINE_SLOW_SPEED)
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/warn-test.sh build
      - name: Firmware upgrade check test (a bad upgrade rolled back by itself and confirmed, held off; a good one kept)
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/upgrade-test.sh build
      - name: "Single-image rollback test (OpenWRT's handler on a fake flash: a copy kept over sysupgrade, written back; agd rolls back through it)"
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/single-image-test.sh build
      - name: Why-was-it-slow test (the home's timeline kept, a weak device and the internet down explained, WhySlow())
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/why-test.sh build
      - name: "Demo home test (the demo image's simulated home with the real agd: the slow evening explained, smart queueing kept, labelled demo; refused outside QEMU)"
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/demo-test.sh build
      - name: "ISP signals test (a week of days: a faster plan and mesh Wi-Fi, OfferFound! once, no names, share 0)"
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/offers-test.sh build
      - name: "Help-desk brief test (a fresh check, a weak laptop named only by kind for the ISP, a full line: SQM only proposed; the internet down: no technician)"
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/brief-test.sh build
      - name: "Proactive care test (the internet down: one ticket to the ISP with a plain note; a flap not told twice; advise proposes, enforce fixes; the day's limit)"
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/proactive-test.sh build
      - name: "Mesh Wi-Fi test (a simulated EasyMesh controller: a move proposed, approved and kept; one moved back; a miss; the controller's own steers left alone; a channel plan; a weak backhaul to the ISP)"
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/mesh-test.sh build
      - name: "Coverage advice test (a simulated home: a phone that moves to a far room at night, a TV that lives there, a weak smart plug; one shared spot, an extender about halfway; kinds for the ISP; a ticket that says where)"
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/coverage-test.sh build
      - name: "Home model test (places, path loss, the bedroom's problems; 2.4 GHz there before buying an extender; zones stay home; HomeAdvice! without names)"
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/home-test.sh build
      - name: "Wi-Fi sensing test (off by default and keeps nothing; consent; movement by zone; presence local only unless share_events; CSI handler; off forgets)"
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/sense-test.sh build
      - name: "Smart queueing test (real bufferbloat on a veth WAN: proposed, shaped, kept; tried and undone)"
        run: |
          (sudo modprobe sch_netem && sudo modprobe ifb) ||
            (sudo apt-get update -q && sudo apt-get install -y -q "linux-modules-extra-$(uname -r)") || true
          sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/sqm-test.sh build
      - name: "Calls and games first test (a call next to a 10 Mbit/s stream: first in smart queueing, proved smooth; rough without it)"
        run: |
          (sudo modprobe sch_netem && sudo modprobe ifb && sudo modprobe cls_flower && sudo modprobe act_skbedit) ||
            (sudo apt-get update -q && sudo apt-get install -y -q "linux-modules-extra-$(uname -r)") || true
          sudo AIGW_REQUIRE_CALLS=1 PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/calls-test.sh build
      - name: USP test (a USP controller over MQTT, OB-USP-Agent, the aigw-usp plug-in)
        run: sudo AIGW_REQUIRE_USP=1 AIGW_OBUSPA="$OBUSPA_SRC/obuspa" PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/usp-test.sh build
      - name: TR-069 test (an ACS over HTTP, icwmp, the aigw-cwmp-dm data model daemon)
        run: sudo AIGW_REQUIRE_CWMP=1 AIGW_ICWMPD="$ICWMPD" PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/cwmp-test.sh build
      - name: Act test (decisions, guardrails, nft and DNS actuators)
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/act-test.sh build
      - name: Plug-in test (plug-ins, skills, Wi-Fi keys, MQTT and Home Assistant)
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/plug-test.sh build
      - name: Outside test (bridge, cortex, retrain, signed hot-loaded model, MCP)
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/outside-test.sh build
      - name: Federated learning test (three homes, noisy updates, signed shared layer, no names leave)
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/fed-test.sh build
      - name: Fleet learning test (three homes share, cortex aggregates with k-anonymity, signed priors, cold start, tamper)
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/fleet-test.sh build
      - name: "Staged rollout test (four homes, waves through the bridge: one passes; a rollback stops it: the last home never gets it)"
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/rollout-test.sh build
      - name: Area outages (cortex tells, the gateway holds its fixes)
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/area-test.sh build
      - name: Remote access test (WireGuard between network namespaces)
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/remote-test.sh build
      - name: DNS cache test (answer times, prefetch, stale answers)
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/dns-cache-test.sh build
      - name: Connection name test (TLS and QUIC handshakes via NFLOG)
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/sni-test.sh build
      - name: Band steering test (fake dual-band hostapd, presence)
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/steer-test.sh build
      - name: Channel self-healing test (busy channel, proposal, channel switch, undo)
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/chan-test.sh build
      - name: "Neighbour-aware channels test (five days learned: no scan or move while the home is busy; channel 6 not 1; kept on better rates; moved back and avoided on worse)"
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/chanplan-test.sh build
      - name: Fast path test (kernel flowtable; actions send offloaded connections back)
        run: |
          # the flowtable modules live in the kernel's extra modules package on this runner
          if ! modinfo nf_flow_table >/dev/null 2>&1; then
            sudo apt-get install -y -qq --no-install-recommends "linux-modules-extra-$(uname -r)" ||
              echo "no linux-modules-extra-$(uname -r) for this kernel"
          fi
          modinfo -F filename nf_flow_table nf_flow_table_inet nft_flow_offload || true
          sudo AIGW_REQUIRE_FLOWTABLE=1 PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/fastpath-test.sh build
      - name: "Security test (agdns answers the home only; no passwords in firmware messages; TR-069 warnings)"
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/security-test.sh build
      - name: Model back-end test (built-in and loaded back-ends, checked against the reference)
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/backend-test.sh build
      - name: Traffic meter test (eBPF per device on the LAN interface, tcx)
        run: sudo AIGW_REQUIRE_METER=1 PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/meter-test.sh build
      - name: Simulated radios (mac80211_hwsim, hostapd, wpa_supplicant)
        run: |
          sudo apt-get install -y -qq --no-install-recommends hostapd wpasupplicant iw wireless-regdb
          # mac80211_hwsim lives in the kernel's extra modules package
          if ! modinfo mac80211_hwsim >/dev/null 2>&1; then
            sudo apt-get install -y -qq --no-install-recommends "linux-modules-extra-$(uname -r)" ||
              echo "no linux-modules-extra-$(uname -r) for this kernel"
          fi
          modinfo -F filename mac80211_hwsim
          sudo AIGW_REQUIRE_HWSIM=1 PATH="/usr/local/bin:/usr/local/sbin:/usr/sbin:/sbin:$PATH" tests/hwsim-test.sh build
      - name: Shell syntax
        run: for f in scripts/aigw-nft scripts/aigw-dhcp-event scripts/aigw-remote scripts/aigw-selftest platform/openwrt/qemu-test.sh platform/pc-ap/aigw-ap platform/pc-ap/install.sh platform/pc-ap/uninstall.sh tests/*.sh plugins/examples/*/run.sh usp/aigw-usp-run scripts/build-obuspa.sh scripts/build-icwmp.sh cwmp/aigw-cwmp-run platform/openwrt/aigw/files/aigw-cwmp.init scripts/dm-xml tests/cwmp/acs.py tests/usp/uspc.py platform/pc-ap/wifi-config platform/openwrt/aigw/files/wifi-config platform/openwrt/aigw/files/firmware platform/openwrt/aigw/files/mesh-dataelements tests/mesh/fakectl.py tests/fw/firmware cwmp/defaultreset platform/openwrt/qemu_console.py platform/openwrt/flash-kb.py scripts/try-aigw.sh platform/openwrt/build-demo-image.sh platform/openwrt/aigw/files/aigw-demo.init platform/openwrt/upgrade-test.sh platform/openwrt/upgrade-vm.sh platform/openwrt/upgrade_console.py; do case "$f" in *dm-xml|*.py) python3 -m py_compile "$f" ;; *) sh -n "$f" ;; esac; done

  openwrt:
    name: OpenWRT ${{ matrix.version }} ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: "24.10", target: x86/64 }
          - { version: "24.10", target: mediatek/filogic }
          - { version: "24.10", target: ramips/mt7621 }
          - { version: "25.12", target: x86/64 }
    steps:
      - uses: actions/checkout@v5
      - name: Packages
        run: |
          # GitHub's runners use Azure's Ubuntu mirror; when it can't be resolved, Ubuntu's own
          getent hosts azure.archive.ubuntu.com >/dev/null || sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential curl rsync unzip file gawk \
            python3 python3-setuptools zstd libncurses-dev
      - name: Build package
        env:
          VERSION: ${{ matrix.version }}
          TARGET: ${{ matrix.target }}
        run: platform/openwrt/build-sdk.sh
      - name: Name artifact
        id: name
        run: echo "name=aigw-openwrt-${{ matrix.version }}-$(echo '${{ matrix.target }}' | tr / -)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: dist/openwrt/
      - name: "Small and minimal profiles: built, and the installed flash of each (docs/features.md)"
        if: matrix.version == '24.10'
        env:
          VERSION: ${{ matrix.version }}
          TARGET: ${{ matrix.target }}
        run: |
          for p in small minimal; do AIGW_PROFILE=$p platform/openwrt/build-sdk.sh; done
          python3 platform/openwrt/flash-kb.py dist/openwrt dist/openwrt-small dist/openwrt-minimal | tee -a "$GITHUB_STEP_SUMMARY"

  openwrt-qemu:
    name: OpenWRT 24.10 in QEMU, ${{ matrix.arch }} (install, aigw-selftest --full, LuCI)
    # x86_64 also flashes three times (an upgrade from the ACS, one with a copy kept, the copy written back)
    needs: [openwrt]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, artifact: aigw-openwrt-24.10-x86-64 }
          - { arch: mipsel_24kc, artifact: aigw-openwrt-24.10-ramips-mt7621 }
          - { arch: aarch64_cortex-a53, artifact: aigw-openwrt-24.10-mediatek-filogic }
    steps:
      - uses: actions/checkout@v5
      - name: Packages
        run: |
          # GitHub's runners use Azure's Ubuntu mirror; when it can't be resolved, Ubuntu's own
          getent hosts azure.archive.ubuntu.com >/dev/null || sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-system-mips qemu-system-arm \
            curl python3
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/openwrt/
      - name: Install and self-test in OpenWRT
        run: ARCH=${{ matrix.arch }} platform/openwrt/qemu-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-console-log-${{ matrix.arch }}
          path: dist/openwrt/qemu-*.log

  upgrade:
    name: "Upgrade from ${{ matrix.from }} on OpenWRT 24.10 x86-64 in QEMU (nothing lost or reset)"
    # an older release from GitHub, a home set up on it, this build's packages over it with opkg, a reboot
    needs: [openwrt]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        from: [v0.29.2, v0.33.1, latest]
    steps:
      - uses: actions/checkout@v5
      - name: Packages
        run: |
          # GitHub's runners use Azure's Ubuntu mirror; when it can't be resolved, Ubuntu's own
          getent hosts azure.archive.ubuntu.com >/dev/null || sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 curl python3
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: aigw-openwrt-24.10-x86-64
          path: dist/openwrt/
      - name: "Upgrade ${{ matrix.from }} to this build: settings, policies, devices, decisions, care history, remote phone, data model"
        env:
          GH_TOKEN: ${{ github.token }}
        run: FROM=${{ matrix.from }} platform/openwrt/upgrade-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-console-log-${{ matrix.from }}
          path: dist/openwrt/upgrade-*.log

  pcap-upgrade:
    name: PC as AP upgrade (the latest release's install.sh, then this one's)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Packages
        run: |
          getent hosts azure.archive.ubuntu.com >/dev/null || sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          sudo apt-get update -qq
          # what install.sh's unit tests (cortex) use besides what it installs itself
          sudo apt-get install -y -qq --no-install-recommends python3 python3-numpy python3-sklearn python3-cryptography
      - name: "Upgrade: settings, Wi-Fi settings, remote phone, devices, decisions, care history, data model; config 0600"
        env:
          GH_TOKEN: ${{ github.token }}
        run: sudo CI=true GH_TOKEN="$GH_TOKEN" tests/pcap-upgrade-test.sh

  demo-image:
    name: Demo image (OpenWRT 24.10 x86-64, AIGW OS, a simulated home and fleet), booted as docs/try-it.md says
    needs: [openwrt]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Packages
        run: |
          # GitHub's runners use Azure's Ubuntu mirror; when it can't be resolved, Ubuntu's own
          getent hosts azure.archive.ubuntu.com >/dev/null || sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          sudo apt-get update -qq
          # ImageBuilder's needs, and what try-aigw.sh needs (QEMU, curl, an ssh client for its checks)
          sudo apt-get install -y -qq --no-install-recommends build-essential libncurses-dev zlib1g-dev gawk \
            unzip file rsync python3 python3-setuptools zstd curl wget qemu-system-x86 openssh-client
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: aigw-openwrt-24.10-x86-64
          path: dist/openwrt/
      - name: Build the demo image (OpenWRT's ImageBuilder)
        run: VERSION=24.10 platform/openwrt/build-demo-image.sh
      - name: "Boot it with scripts/try-aigw.sh --check (dashboard, demo data, this VM's home through its bridge, agctl over ssh)"
        run: scripts/try-aigw.sh --image dist/demo/aigw-os-demo-x86-64.img.gz --check
      - uses: actions/upload-artifact@v4
        with:
          name: demo-image
          path: dist/demo/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-console-log
          path: ~/.cache/aigw-demo/console.log

  release:
    name: Release packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, openwrt, openwrt-qemu, demo-image, upgrade, pcap-upgrade]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # architecture-independent packages (e.g. aigw-remote_*_all.ipk) come from
        # every target with the same name: upload one of each. aigw-demo is only for
        # the demo image (attached, with its checksum and scripts/try-aigw.sh)
        run: |
          mkdir -p up
          find dist -type f \( -name '*.ipk' -o -name '*.apk' \) ! -name 'aigw-demo[_-]*' | sort | while read -r f; do
            [ -e "up/$(basename "$f")" ] || cp "$f" up/
          done
          cp dist/demo-image/aigw-os-demo-x86-64.img.gz dist/demo-image/aigw-os-demo-x86-64.img.gz.sha256 \
            scripts/try-aigw.sh up/
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --generate-notes up/*
