name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  linux:
    name: Linux build, tests, smoke test
    runs-on: ubuntu-24.04
    # a stalled runner (it happened in the package download) fails in time
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Packages
        timeout-minutes: 20
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential cmake pkg-config git libjson-c-dev libnetfilter-conntrack-dev \
            dnsutils nftables dnsmasq-base curl python3 mosquitto mosquitto-clients zbar-tools \
            python3-numpy python3-sklearn python3-cryptography wireguard-tools \
            autoconf automake libtool libssl-dev libsqlite3-dev zlib1g-dev libmosquitto-dev \
            protobuf-compiler python3-protobuf python3-paho-mqtt \
            libcurl4-openssl-dev libmxml-dev uuid-dev
      - name: OpenWRT libraries
        run: sudo ./scripts/build-deps.sh
      - name: OB-USP-Agent (USP / TR-369 agent, pinned)
        run: echo "OBUSPA_SRC=$(scripts/build-obuspa.sh | tail -1)" >> "$GITHUB_ENV"
      - name: icwmp (TR-069 client, pinned)
        run: echo "ICWMPD=$(scripts/build-icwmp.sh | tail -1)" >> "$GITHUB_ENV"
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DAIGW_OBUSPA_SRC="$OBUSPA_SRC"
          cmake --build build -j
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Smoke test
        run: sudo UPSTREAM=1.1.1.1 tests/smoke.sh build
      - name: Flow sensor test (network namespaces)
        run: sudo tests/flow-test.sh build
      - name: Behaviour baseline test (network namespaces, fast clock)
        run: sudo tests/baseline-test.sh build
      - name: Lookup burst test (generated names that look like words, caught by behaviour)
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/burst-test.sh build
      - name: Data model test (ag.dm, the layer USP and TR-069 share)
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/dm-test.sh build
      - name: USP test (a USP controller over MQTT, OB-USP-Agent, the aigw-usp plug-in)
        run: sudo AIGW_REQUIRE_USP=1 AIGW_OBUSPA="$OBUSPA_SRC/obuspa" PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/usp-test.sh build
      - name: TR-069 test (an ACS over HTTP, icwmp, the aigw-cwmp-dm data model daemon)
        run: sudo AIGW_REQUIRE_CWMP=1 AIGW_ICWMPD="$ICWMPD" PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/cwmp-test.sh build
      - name: Act test (decisions, guardrails, nft and DNS actuators)
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/act-test.sh build
      - name: Plug-in test (plug-ins, skills, Wi-Fi keys, MQTT and Home Assistant)
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/plug-test.sh build
      - name: Outside test (bridge, cortex, retrain, signed hot-loaded model, MCP)
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/outside-test.sh build
      - name: Federated learning test (three homes, noisy updates, signed shared layer, no names leave)
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/fed-test.sh build
      - name: Remote access test (WireGuard between network namespaces)
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/remote-test.sh build
      - name: DNS cache test (answer times, prefetch, stale answers)
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/dns-cache-test.sh build
      - name: Connection name test (TLS and QUIC handshakes via NFLOG)
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/sni-test.sh build
      - name: Band steering test (fake dual-band hostapd, presence)
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/steer-test.sh build
      - name: Channel self-healing test (busy channel, proposal, channel switch, undo)
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/chan-test.sh build
      - name: Fast path test (kernel flowtable; actions send offloaded connections back)
        run: |
          # the flowtable modules live in the kernel's extra modules package on this runner
          if ! modinfo nf_flow_table >/dev/null 2>&1; then
            sudo apt-get install -y -qq --no-install-recommends "linux-modules-extra-$(uname -r)" ||
              echo "no linux-modules-extra-$(uname -r) for this kernel"
          fi
          modinfo -F filename nf_flow_table nf_flow_table_inet nft_flow_offload || true
          sudo AIGW_REQUIRE_FLOWTABLE=1 PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/fastpath-test.sh build
      - name: Model back-end test (built-in and loaded back-ends, checked against the reference)
        run: sudo PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/backend-test.sh build
      - name: Traffic meter test (eBPF per device on the LAN interface, tcx)
        run: sudo AIGW_REQUIRE_METER=1 PATH="/usr/local/bin:/usr/local/sbin:$PATH" tests/meter-test.sh build
      - name: Simulated radios (mac80211_hwsim, hostapd, wpa_supplicant)
        run: |
          sudo apt-get install -y -qq --no-install-recommends hostapd wpasupplicant iw wireless-regdb
          # mac80211_hwsim lives in the kernel's extra modules package
          if ! modinfo mac80211_hwsim >/dev/null 2>&1; then
            sudo apt-get install -y -qq --no-install-recommends "linux-modules-extra-$(uname -r)" ||
              echo "no linux-modules-extra-$(uname -r) for this kernel"
          fi
          modinfo -F filename mac80211_hwsim
          sudo AIGW_REQUIRE_HWSIM=1 PATH="/usr/local/bin:/usr/local/sbin:/usr/sbin:/sbin:$PATH" tests/hwsim-test.sh build
      - name: Shell syntax
        run: for f in scripts/aigw-nft scripts/aigw-dhcp-event scripts/aigw-remote scripts/aigw-selftest platform/openwrt/qemu-test.sh platform/pc-ap/aigw-ap platform/pc-ap/install.sh platform/pc-ap/uninstall.sh tests/*.sh plugins/examples/*/run.sh usp/aigw-usp-run scripts/build-obuspa.sh scripts/build-icwmp.sh cwmp/aigw-cwmp-run platform/openwrt/aigw/files/aigw-cwmp.init scripts/dm-xml tests/cwmp/acs.py tests/usp/uspc.py platform/pc-ap/wifi-config platform/openwrt/aigw/files/wifi-config platform/openwrt/aigw/files/firmware tests/fw/firmware; do case "$f" in *dm-xml|*.py) python3 -m py_compile "$f" ;; *) sh -n "$f" ;; esac; done

  openwrt:
    name: OpenWRT ${{ matrix.version }} ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: "24.10", target: x86/64 }
          - { version: "24.10", target: mediatek/filogic }
          - { version: "24.10", target: ramips/mt7621 }
          - { version: "25.12", target: x86/64 }
    steps:
      - uses: actions/checkout@v5
      - name: Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential curl rsync unzip file gawk \
            python3 python3-setuptools zstd libncurses-dev
      - name: Build package
        env:
          VERSION: ${{ matrix.version }}
          TARGET: ${{ matrix.target }}
        run: platform/openwrt/build-sdk.sh
      - name: Name artifact
        id: name
        run: echo "name=aigw-openwrt-${{ matrix.version }}-$(echo '${{ matrix.target }}' | tr / -)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: dist/openwrt/

  openwrt-qemu:
    name: OpenWRT 24.10 in QEMU, ${{ matrix.arch }} (install, aigw-selftest --full, LuCI)
    needs: [openwrt]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, artifact: aigw-openwrt-24.10-x86-64 }
          - { arch: mipsel_24kc, artifact: aigw-openwrt-24.10-ramips-mt7621 }
          - { arch: aarch64_cortex-a53, artifact: aigw-openwrt-24.10-mediatek-filogic }
    steps:
      - uses: actions/checkout@v5
      - name: Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-system-mips qemu-system-arm \
            curl python3
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/openwrt/
      - name: Install and self-test in OpenWRT
        run: ARCH=${{ matrix.arch }} platform/openwrt/qemu-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-console-log-${{ matrix.arch }}
          path: dist/openwrt/qemu-*.log

  release:
    name: Release packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, openwrt, openwrt-qemu]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # architecture-independent packages (e.g. aigw-remote_*_all.ipk) come from
        # every target with the same name: upload one of each
        run: |
          mkdir -p up
          find dist -type f \( -name '*.ipk' -o -name '*.apk' \) | sort | while read -r f; do
            [ -e "up/$(basename "$f")" ] || cp "$f" up/
          done
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --generate-notes up/*
